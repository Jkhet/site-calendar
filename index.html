<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar All Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#285a48;--navy-dark:#091413;--teal:#408a71;--mint:#b0e4cc;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Kanit','Noto Sans Thai',sans-serif;font-size:14px;line-height:1.5;background:var(--bg);color:var(--ink);padding:14px 18px}
.wrap{max-width:1200px;margin:0 auto}
header{position:relative;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;padding:16px 22px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(9,20,19,.35)}
header h1{font-size:20px;font-weight:600;letter-spacing:.2px}
header p{opacity:.82;font-size:12.5px;font-weight:300;letter-spacing:.2px;margin-top:3px}
.presence{position:absolute;top:14px;right:18px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;user-select:none}
.presence:hover{background:rgba(255,255,255,.26)}
.presence .dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;flex-shrink:0}
.presence .dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.35)}
.presence .dot.off{background:#ef4444}
.presence-pop{position:absolute;top:130%;right:0;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.2);padding:8px 12px;font-size:12px;min-width:130px;max-height:200px;overflow:auto;display:none;z-index:60}
.presence-pop.show{display:block}
.presence-pop div{padding:3px 0;white-space:nowrap}
@media(max-width:640px){.presence{top:12px;right:12px;padding:5px 10px;font-size:11px}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button{border:0;border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:500;letter-spacing:.2px;cursor:pointer;font-family:inherit;transition:background .15s ease}
.primary{background:var(--navy);color:#fff}.primary:hover{background:var(--navy-dark)}
.ghost{background:#fff;border:1px solid #cbd5e1;color:var(--ink)}.ghost:hover{background:#f8fafc}
.danger{background:#fee2e2;color:#b91c1c}.danger:hover{background:#fecaca}
select,input,textarea{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:13.5px;width:100%;background:#fff;color:var(--ink)}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nav h2{font-size:16px;font-weight:600;letter-spacing:.2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:11.5px;font-weight:600;letter-spacing:.3px;color:var(--muted);padding:5px 0}
.day{min-height:80px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:5px;cursor:pointer;transition:.15s}
.day:hover{border-color:var(--navy);background:#eafaf3}
.day.off{opacity:.4}.day.today{border:2px solid var(--teal);background:#eafaf3}
.dnum{font-size:11.5px;font-weight:600;color:#475569;margin-bottom:3px}
.ev{font-size:10.5px;padding:2px 5px;border-radius:5px;margin-bottom:3px;color:#fff;line-height:1.3;overflow:hidden}
.s1{background:#64748b}.s2{background:#f59e0b}.s3{background:#16a34a}.s4{background:#dc2626}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f8fafc;padding:8px 9px;text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.2px;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px 9px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:#f8fafc}
.tag{padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap;border:1px solid transparent}
.tag.s1{background:#f1f5f9;color:#475569;border-color:#cbd5e1}
.tag.s2{background:#fef3c7;color:#92400e;border-color:#fde68a}
.tag.s3{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.tag.s4{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:10px;padding:11px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat b{display:block;font-size:21px;font-weight:700;color:var(--navy)}
.stat span{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.box{background:#fff;border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:11.5px;font-weight:600;letter-spacing:.2px;color:var(--muted);display:block;margin:10px 0 4px}
#ro{background:#fef3c7;color:#92400e;padding:8px 12px;border-radius:9px;font-size:13px;margin-bottom:12px;display:none}
@media(max-width:640px){.day{min-height:56px}.ev{font-size:9px}.grid2{grid-template-columns:1fr}body{padding:10px}}
@media print{.bar,.nav button,header{display:none}#tableCard{display:block !important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>📅 Calendar All Project</h1>
  <p>ข้อมูลส่วนกลางบน Google Sheets</p>
  <div class="presence" id="presenceBox" onclick="togglePresence(event)">
    <span class="dot" id="presenceDot"></span>
    <span id="presenceCount">-</span>
    <div class="presence-pop" id="presencePop"></div>
  </div>
</header>

<div id="ro"></div>
<div class="stats" id="stats"></div>

<div class="bar">
  <button class="primary" onclick="openForm()">+ เพิ่มรายการ</button>
  <button class="ghost" onclick="pull()">🔄 รีเฟรช</button>
  <button class="ghost" onclick="share()">🔗 คัดลอกลิงก์</button>
  <button class="ghost" onclick="expCSV()">⬇️ CSV</button>
  <button class="ghost" onclick="window.print()">🖨️ พิมพ์</button>
  <button class="ghost" id="btnTable" onclick="toggleTable()">📋 สรุปรายการ</button>
</div>

<div class="bar">
  <select id="fP" onchange="draw()" style="max-width:200px"><option value="">— All Project —</option></select>
  <select id="fS" onchange="draw()" style="max-width:180px"><option value="">— All Site —</option></select>
  <select id="fL" onchange="draw()" style="max-width:180px"><option value="">— All Team —</option></select>
</div>

<div class="card">
  <div class="nav">
    <button class="ghost" onclick="mv(-1)">‹ ก่อนหน้า</button>
    <h2 id="title"></h2>
    <button class="ghost" onclick="mv(1)">ถัดไป ›</button>
  </div>
  <div class="cal" id="cal"></div>
</div>

<div class="card" id="tableCard" style="display:none">
  <h2 style="font-size:16px;margin-bottom:10px">📋 รายการทั้งหมดในเดือนนี้</h2>
  <div style="overflow-x:auto"><table id="tb"></table></div>
</div>
</div>

<div class="modal" id="modal">
 <div class="box">
  <h2 style="font-size:18px;margin-bottom:6px" id="mTitle">เพิ่มรายการเข้า Site</h2>
  <div class="grid2">
    <div><label>วันที่ *</label><input type="date" id="f_date"></div>
    <div><label>สถานะ</label><select id="f_status">
      <option>วางแผน</option><option>กำลังดำเนินการ</option><option>เสร็จสิ้น</option><option>เลื่อน</option>
    </select></div>
    <div><label>เวลาเข้า</label><input type="time" id="f_in" value="08:30"></div>
    <div><label>เวลาออก</label><input type="time" id="f_out" value="17:00"></div>
  </div>
  <label>ชื่อ Project *</label><input id="f_proj" placeholder="เช่น The Flash">
  <div class="grid2">
    <div><label>ชื่อ Site *</label><input id="f_site" placeholder="เช่น Site ABC1234"></div>
    <div><label>หัวหน้าทีม *</label><input id="f_lead" placeholder="เช่น คุณสมชาย"></div>
    <div><label>จำนวนทีม (คน)</label><input type="number" id="f_num" value="1" min="1"></div>
    <div><label>ประเภทงาน</label><select id="f_type">
      <option>ติดตั้ง</option><option>ตรวจสอบ</option><option>ซ่อมบำรุง</option><option>สำรวจ</option><option>อื่นๆ</option>
    </select></div>
  </div>
  <label>หมายเหตุ</label><textarea id="f_note" rows="2"></textarea>
  <div class="bar" style="margin-top:16px;justify-content:flex-end">
    <button class="danger" id="btnDel" onclick="del()" style="display:none">ลบ</button>
    <button class="ghost" onclick="closeForm()">ยกเลิก</button>
    <button class="primary" onclick="save()">บันทึก</button>
  </div>
 </div>
</div>

<script>
/* ============ ตั้งค่า ============ */
var API = 'https://script.google.com/macros/s/AKfycbyqGs1aJdwZN21m357fzmCrR4Ei3lNf8EfB1dy5zxxr2ESoqkdzaX7bevqs9oJjCCQRVg/exec';
var TOKEN = 'mySecret2026';   /* ต้องตรงกับ TOKEN ใน Apps Script (SiteVisitDB.gs) เป๊ะๆ */

/* ============ ตัวแปรระบบ ============ */
var DOW = ['จ','อ','พ','พฤ','ศ','ส','อา'];
var MON = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var SC = {'วางแผน':'s1','กำลังดำเนินการ':'s2','เสร็จสิ้น':'s3','เลื่อน':'s4'};
var data = [], editId = null, busy = false, editSnapshot = null;

/* ตัวชี้เดือนที่กำลังดู — ล็อกไว้ที่วันที่ 1 เสมอ กัน setMonth() ไหลข้ามเดือน
   (เช่น ถ้าวันนี้คือ 31 ม.ค. แล้วเก็บ cur เป็นวันที่ 31 เต็มๆ พอ setMonth ไปกุมภาพันธ์
   ซึ่งไม่มีวันที่ 31 มันจะไหลไปมีนาคมแทน ต้องล็อก day=1 ก่อนเสมอ) */
var cur = new Date();
cur.setDate(1);

var ME = localStorage.getItem('myName');
if (!ME) { ME = prompt('ใส่ชื่อคุณ (แสดงว่าใครแก้ไขล่าสุด):') || 'ไม่ระบุ'; localStorage.setItem('myName', ME); }

/* ============ ความปลอดภัย: escape ข้อความก่อนแทรกลง HTML ============ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ============ วันที่ท้องถิ่น (กันปัญหา toISOString เพี้ยนช่วงเที่ยงคืน) ============ */
function todayLocal() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* ============ snapshot ของ record ตอนเปิดฟอร์ม ใช้เช็ค conflict ก่อนบันทึกทับ ============ */
function snap(e) {
  if (!e) return null;
  var c = {};
  for (var k in e) if (k !== 'updatedBy') c[k] = e[k];
  return JSON.stringify(c);
}

function msg(text, show) {
  var el = document.getElementById('ro');
  el.textContent = text || '';
  el.style.display = show ? 'block' : 'none';
}

/* ============ เชื่อมต่อ Google Sheets ============ */
function pull(silent) {
  if (!silent) msg('⏳ กำลังโหลดข้อมูล', true);
  busy = true;
  fetch(API + '?token=' + encodeURIComponent(TOKEN) + '&t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) throw new Error(j.error);
      data = j.data;
      msg('', false);
      draw();
    })
    .catch(function (e) {
      msg('⚠️ เชื่อมต่อไม่สำเร็จ: ' + e.message + ' — กด 🔄 รีเฟรชเพื่อลองใหม่', true);
    })
    .then(function () { busy = false; });
}

function push(action, payload) {
  msg('💾 กำลังบันทึกลงส่วนกลาง...', true);
  busy = true;
  var body = { token: TOKEN, action: action };
  for (var k in payload) body[k] = payload[k];
  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) throw new Error(j.error);
      data = j.data;
      msg('', false);
      draw();
    })
    .catch(function (e) {
      msg('⚠️ บันทึกไม่สำเร็จ: ' + e.message, true);
      alert('บันทึกไม่สำเร็จ: ' + e.message);
    })
    .then(function () { busy = false; });
}

function uid() { return Date.now() + '' + Math.floor(Math.random() * 999); }

/* ============ สถานะออนไลน์ (ping ไป Apps Script ทุก 15 วิ, cache หมดอายุถ้าไม่ ping ต่อ) ============ */
function pingPresence() {
  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: TOKEN, action: 'ping', name: ME })
  })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j.ok) renderPresence(j.online || []); })
    .catch(function () { /* เงียบไว้ ไม่รบกวนการทำงานหลัก */ });
}

function renderPresence(names) {
  var dot = document.getElementById('presenceDot');
  var count = document.getElementById('presenceCount');
  var pop = document.getElementById('presencePop');
  var n = names.length;
  count.textContent = n + ' คนออนไลน์';
  dot.className = 'dot ' + (n > 0 ? 'on' : 'off');
  pop.innerHTML = n
    ? names.map(function (nm) { return '<div>🟢 ' + esc(nm) + '</div>'; }).join('')
    : '<div style="opacity:.7">ไม่มีใครออนไลน์</div>';
}

function togglePresence(ev) {
  ev.stopPropagation();
  document.getElementById('presencePop').classList.toggle('show');
}
document.addEventListener('click', function (ev) {
  var box = document.getElementById('presenceBox');
  if (box && !box.contains(ev.target)) document.getElementById('presencePop').classList.remove('show');
});

/* ============ ฟิลเตอร์ ============ */
function filtered() {
  var p = fP.value, s = fS.value, l = fL.value;
  return data.filter(function (e) {
    return (!p || e.proj === p) && (!s || e.site === s) && (!l || e.lead === l);
  });
}
function fillFilters() {
  [['fP','proj'],['fS','site'],['fL','lead']].forEach(function (pair) {
    var el = document.getElementById(pair[0]), v = el.value;
    var seen = {}, opts = [];
    data.forEach(function (e) {
      var x = e[pair[1]];
      if (x && !seen[x]) { seen[x] = 1; opts.push(x); }
    });
    opts.sort();
    el.innerHTML = el.options[0].outerHTML + opts.map(function (o) {
      return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('');
  });
}
function mv(n) { cur.setMonth(cur.getMonth() + n); draw(); }

/* ============ ย่อ/ขยาย การ์ดรายการทั้งหมดในเดือนนี้ (ซ่อนไว้เป็นค่าเริ่มต้น กันหน้าจอรก) ============ */
function toggleTable() {
  var card = document.getElementById('tableCard');
  var btn = document.getElementById('btnTable');
  var show = card.style.display === 'none';
  card.style.display = show ? '' : 'none';
  btn.textContent = show ? '📋 ซ่อนรายการ' : '📋 สรุปรายการ';
  if (show) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ============ วาดหน้าจอ ============ */
function draw() {
  var y = cur.getFullYear(), m = cur.getMonth();
  title.textContent = MON[m] + ' ' + (y + 543);
  var start = (new Date(y, m, 1).getDay() + 6) % 7;
  var days = new Date(y, m + 1, 0).getDate();
  var prev = new Date(y, m, 0).getDate();
  var ev = filtered(), today = new Date().toDateString();

  var h = DOW.map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');
  for (var i = start - 1; i >= 0; i--) h += '<div class="day off"><div class="dnum">' + (prev - i) + '</div></div>';
  for (var d = 1; d <= days; d++) {
    var ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    var list = ev.filter(function (e) { return e.date === ds; });
    var t = new Date(y, m, d).toDateString() === today ? ' today' : '';
    h += '<div class="day' + t + '" onclick="openForm(\'' + ds + '\')"><div class="dnum">' + d + '</div>' +
      list.map(function (e) {
        return '<div class="ev ' + (SC[e.status] || 's1') + '" onclick="event.stopPropagation();openForm(null,\'' + esc(e.id) + '\')"><b>' + esc(e.site) + '</b><br>' + esc(e.lead) + '</div>';
      }).join('') + '</div>';
  }
  var tail = (7 - ((start + days) % 7)) % 7;
  for (var j = 1; j <= tail; j++) h += '<div class="day off"><div class="dnum">' + j + '</div></div>';
  cal.innerHTML = h;

  var mo = ev.filter(function (e) {
    var p = e.date.split('-');
    return +p[0] === y && +p[1] === m + 1;
  }).sort(function (a, b) { return a.date.localeCompare(b.date); });

  tb.innerHTML = '<tr><th>วันที่</th><th>เวลา</th><th>Project</th><th>Site</th><th>หัวหน้าทีม</th><th>ทีม</th><th>ประเภท</th><th>สถานะ</th><th>หมายเหตุ</th><th>แก้ไขโดย</th><th></th></tr>' +
    (mo.length ? mo.map(function (e) {
      return '<tr><td>' + esc(e.date.split('-').reverse().join('/')) + '</td><td>' + esc(e.tin || '-') + '–' + esc(e.tout || '-') + '</td>' +
        '<td>' + esc(e.proj) + '</td><td><b>' + esc(e.site) + '</b></td><td>' + esc(e.lead) + '</td><td>' + esc(e.num || '-') + '</td><td>' + esc(e.type || '-') + '</td>' +
        '<td><span class="tag ' + (SC[e.status] || 's1') + '">' + esc(e.status) + '</span></td><td>' + esc(e.note || '-') + '</td>' +
        '<td style="font-size:11px;color:#64748b">' + esc(e.updatedBy || '-') + '</td>' +
        '<td><button class="ghost" style="padding:4px 9px" onclick="openForm(null,\'' + esc(e.id) + '\')">แก้ไข</button></td></tr>';
    }).join('') : '<tr><td colspan="11" style="text-align:center;color:#94a3b8;padding:26px">ยังไม่มีรายการในเดือนนี้</td></tr>');

  var uSite = {}, uLead = {};
  ev.forEach(function (e) { uSite[e.site] = 1; uLead[e.lead] = 1; });
  stats.innerHTML = [
    ['ทั้งหมด', ev.length],
    ['เสร็จสิ้น', ev.filter(function (e) { return e.status === 'เสร็จสิ้น'; }).length],
    ['กำลังดำเนินการ', ev.filter(function (e) { return e.status === 'กำลังดำเนินการ'; }).length],
    ['Site ทั้งหมด', Object.keys(uSite).length],
    ['หัวหน้าทีม', Object.keys(uLead).length]
  ].map(function (s) { return '<div class="stat"><b>' + s[1] + '</b><span>' + esc(s[0]) + '</span></div>'; }).join('');

  fillFilters();
}

/* ============ ฟอร์ม ============ */
function openForm(date, id) {
  editId = id || null;
  btnDel.style.display = id ? 'inline-block' : 'none';
  mTitle.textContent = id ? 'แก้ไขรายการ' : 'เพิ่มรายการเข้า Site';
  var e = null;
  if (id) { for (var i = 0; i < data.length; i++) if (data[i].id === id) e = data[i]; }
  editSnapshot = snap(e);
  f_date.value = e ? e.date : (date || todayLocal());
  f_in.value = e ? e.tin : '08:30';
  f_out.value = e ? e.tout : '17:00';
  f_proj.value = e ? e.proj : '';
  f_site.value = e ? e.site : '';
  f_lead.value = e ? e.lead : '';
  f_num.value = e ? e.num : 1;
  f_type.value = e ? e.type : 'ติดตั้ง';
  f_status.value = e ? e.status : 'วางแผน';
  f_note.value = e ? e.note : '';
  modal.classList.add('on');
}
function closeForm() { modal.classList.remove('on'); }

function save() {
  if (busy) return;
  if (!f_date.value || !f_proj.value.trim() || !f_site.value.trim() || !f_lead.value.trim()) {
    alert('กรุณากรอก วันที่ / Project / Site / หัวหน้าทีม');
    return;
  }
  var row = {
    id: editId || uid(),
    date: f_date.value, tin: f_in.value, tout: f_out.value,
    proj: f_proj.value.trim(), site: f_site.value.trim(), lead: f_lead.value.trim(),
    num: f_num.value, type: f_type.value, status: f_status.value, note: f_note.value.trim(),
    updatedBy: ME + ' • ' + new Date().toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' })
  };

  /* รายการใหม่ ไม่มีอะไรให้ชนกัน บันทึกได้เลย */
  if (!editId) { closeForm(); push('save', { row: row }); return; }

  /* แก้ไขรายการเดิม -> เช็คก่อนว่าระหว่างที่เปิดฟอร์มอยู่ มีคนอื่นแก้ไป/ลบไปหรือยัง */
  busy = true;
  msg('🔎 กำลังตรวจสอบข้อมูลล่าสุดก่อนบันทึก...', true);
  fetch(API + '?token=' + encodeURIComponent(TOKEN) + '&t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) throw new Error(j.error);
      data = j.data;
      var latest = null;
      for (var i = 0; i < data.length; i++) if (data[i].id === editId) latest = data[i];
      busy = false;
      msg('', false);

      if (!latest) {
        if (!confirm('⚠️ รายการนี้ถูกลบไปแล้วโดยคนอื่นระหว่างที่คุณแก้ไขอยู่\nกด "ตกลง" เพื่อบันทึกเป็นรายการใหม่แทน หรือ "ยกเลิก" เพื่อดูข้อมูลล่าสุดก่อน')) {
          draw();
          return;
        }
      } else if (snap(latest) !== editSnapshot) {
        if (!confirm('⚠️ มีคนแก้ไขรายการนี้ไปแล้ว (ล่าสุดโดย ' + latest.updatedBy + ')\nกด "ตกลง" เพื่อบันทึกทับด้วยค่าของคุณ หรือ "ยกเลิก" เพื่อดูข้อมูลล่าสุดก่อน')) {
          draw();
          return;
        }
      }
      closeForm();
      push('save', { row: row });
    })
    .catch(function () {
      /* ตรวจสอบไม่ได้ (เช่นเน็ตหลุด) -> ยังยอมให้บันทึกต่อ ดีกว่าบล็อกผู้ใช้ไปเลย */
      busy = false;
      msg('', false);
      closeForm();
      push('save', { row: row });
    });
}

function del() {
  if (!confirm('ลบรายการนี้? (ทุกคนในทีมจะเห็นผล)')) return;
  var id = editId;
  closeForm();
  push('delete', { id: id });
}

/* ============ ส่งออก / แชร์ ============ */
function share() {
  var link = location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(link).then(function () {
      alert('✅ คัดลอกลิงก์แล้ว');
    });
  } else { prompt('คัดลอกลิงก์นี้:', link); }
}

function expCSV() {
  var H = ['วันที่','เวลาเข้า','เวลาออก','Project','Site','หัวหน้าทีม','จำนวนทีม','ประเภท','สถานะ','หมายเหตุ','แก้ไขโดย'];
  var rows = data.map(function (e) {
    return [e.date, e.tin, e.tout, e.proj, e.site, e.lead, e.num, e.type, e.status, e.note, e.updatedBy];
  });
  var csv = '\uFEFF' + [H].concat(rows).map(function (r) {
    return r.map(function (c) { return '"' + (c == null ? '' : String(c)).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var a = document.createElement('a');
  a.href = window.URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'site-visits.csv';
  a.click();
}

/* ============ เริ่มทำงาน + ซิงก์อัตโนมัติ ============ */
draw();
pull();
pingPresence();
setInterval(function () {
  if (!busy && !modal.classList.contains('on')) pull(true);
}, 20000);
setInterval(pingPresence, 15000);
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) {
    pingPresence();
    if (!busy) pull(true);
  }
});
</script>
